# Build + unit test cho mọi push / PR. Hiếu bổ sung job bảo mật (Gitleaks, Semgrep, Trivy) – IA-NF03.
name: backend-ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B -ntp verify
