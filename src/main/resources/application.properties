spring.application.name=P03_Inventory

# =====================================================================
# Mọi secret lấy từ biến môi trường (file .env hoặc Run Configuration của IntelliJ). KHÔNG ghi mật khẩu vào file này.
# Xem .env.example và README.md.
# =====================================================================

# --- PostgreSQL (mặc định: Neon Cloud của nhóm; chạy Postgres local thì đặt DB_SSLMODE=disable) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST}/${DB_NAME}?sslmode=${DB_SSLMODE:require}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
# SecurityEventLogger cần 1 connection riêng (REQUIRES_NEW) trong lúc giao dịch chính đang mở
spring.datasource.hikari.minimum-idle=2

# --- JPA ---
# Schema do script SQL của nhóm quản lý (01_schema.sql). Hibernate chỉ KIỂM TRA entity khớp bảng, không tự tạo/sửa bảng.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- JSON ---
# Chống mass assignment (TH-03, SEC-TC-308): body có trường lạ -> 400 UNKNOWN_FIELD
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.time-zone=UTC

# --- Server / lỗi: không bao giờ trả stack trace hay chi tiết kỹ thuật (IA-NF04) ---
server.port=${SERVER_PORT:8080}
# Chỉ tin X-Forwarded-For từ proxy nội bộ (Nginx) – trust boundary TB1 -> TB2
server.forward-headers-strategy=native
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.mvc.problemdetails.enabled=false

# --- JWT (SDD mục 6, IA-NF01): HS256, khóa >= 256 bit, hạn 30 phút ---
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl=30m
app.jwt.issuer=p03-inventory
# Khóa tài khoản 15 phút sau 5 lần đăng nhập sai
app.security.max-failed-logins=5
app.security.lock-duration=15m
# Chỉ cần khi FE dev chạy khác origin (vd. http://localhost:5173); production đi qua Nginx cùng origin
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# --- Actuator: chỉ mở health ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# --- Swagger UI: chỉ bật ở profile dev (SDD mục 4) ---
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- Log ---
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{request_id:-}] [u=%X{user_id:-}] %logger{36} - %msg%n
logging.level.root=INFO
